name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy src
      # The runner image ships Chrome; REQUIRE_BROWSER makes a missing browser fail the
      # sanitiser tests instead of skipping them.
      - run: uv run pytest --cov
        env:
          REQUIRE_BROWSER: "1"
