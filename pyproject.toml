[project]
name = "briefing"
version = "0.1.0"
description = "Personalised briefing generator: topic-tagged sources, persona-specific cited Markdown briefings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
briefing = "briefing.main:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Tooling scripts, not project code (and protected from edits).
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "D",            # pydocstyle: docstrings are enforced (REQUIREMENTS.md S3)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are named by what they check; a docstring on every test adds nothing.
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: runs against the live OpenAI API; skipped without OPENAI_API_KEY",
]

[tool.coverage.run]
source = ["briefing"]
